[workspace]
resolver = "2"
members = ["crates/verify-core", "crates/verify-report", "adapters/cmsis-dsp", "examples/cmsis-fir-f32"]
exclude = ["platforms/cortex-m"]
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
[profile.release]
opt-level = 3
lto = false
codegen-units = 1
panic = "abort"
